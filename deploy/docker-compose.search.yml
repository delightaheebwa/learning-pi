# Optional searxng web search for Open WebUI (Phase 3).
#
# Not started by default. Launch it alongside the base stack:
#   1. set SEARXNG_SECRET in deploy/.env        (openssl rand -hex 32)
#   2. set ENABLE_RAG_WEB_SEARCH=true in deploy/.env (or via the UI)
#   3. docker compose -f docker-compose.yml -f docker-compose.search.yml up -d
#
# searxng is only reachable on the private pi-net network; it publishes no host
# port. Split into its own file so the base stack never demands SEARXNG_SECRET.
services:
  searxng:
    image: searxng/searxng:latest@sha256:b4e34a39f76b1c860bbc53a0f35b10492029b2b18ef1d868df464fe43d7e0b93
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in deploy/.env to use searxng}
    volumes:
      - searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    networks:
      - pi-net

volumes:
  searxng:
  searxng-cache:
