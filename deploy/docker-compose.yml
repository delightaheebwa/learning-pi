# Open WebUI in front of the host-run pi-bridge (Phase 3).
#
# Secure by default:
#   * Open WebUI's port is published on 127.0.0.1 only — never the LAN.
#   * The bridge is a HOST process bound to Docker's default bridge gateway
#     (docker0, usually 172.17.0.1), reached from the container as
#     host.docker.internal. A narrow ufw rule (see README) admits docker traffic.
#   * No open-terminal / tool-server: the old stack's terminal service is dropped.
#
# The bridge itself is NOT a compose service — it runs on the host under systemd
# (see pi-bridge.service) because it drives a real shell and the learning system.
#
# Usage:  cp .env.example .env && $EDITOR .env
#         docker compose up -d                     # Open WebUI only
#         docker compose -f docker-compose.yml -f docker-compose.search.yml up -d
#                                                  # + optional searxng
name: pi-webui

services:
  open-webui:
    # Pinned to the v0.13.0 release index digest (2026-11-03). No moving tag.
    # v0.13.0 ships one-way DB migrations: back up webui.db before upgrading
    # (see deploy/README.md, "Upgrade Open WebUI").
    image: ghcr.io/open-webui/open-webui:v0.13.0@sha256:2272b0fb7c8783a016bcc179abb467cfa34590c99c5e6560fe0e9155b4820a09
    container_name: open-webui
    restart: unless-stopped
    # Loopback-only publish. Do NOT change to 0.0.0.0/3000 without a firewall or
    # a Tailscale-only bind (see SECURITY.md).
    ports:
      - "127.0.0.1:3000:8080"
    # Linux containers cannot reach the host's 127.0.0.1. On Linux,
    # host-gateway resolves to Docker's DEFAULT bridge gateway (docker0, usually
    # 172.17.0.1) — NOT this stack's own network — so the bridge must bind that
    # address. Check yours with `ip -4 addr show docker0`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in deploy/.env}
      WEBUI_URL: ${WEBUI_URL:-http://127.0.0.1:3000}
      # First user to register becomes admin. After that, set ENABLE_SIGNUP=false.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      # Pre-wire the pi-bridge as the OpenAI connection (same key as the bridge).
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://host.docker.internal:8790/v1}
      OPENAI_API_KEY: ${PI_BRIDGE_API_KEY:?set PI_BRIDGE_API_KEY in deploy/.env}
      # Web search for the chat UI. Defaults to keyless DuckDuckGo so the
      # search toggle works out of the box; start docker-compose.search.yml to
      # switch to the private self-hosted searxng engine (that file overrides
      # RAG_WEB_SEARCH_ENGINE). Set ENABLE_RAG_WEB_SEARCH=false to disable.
      ENABLE_RAG_WEB_SEARCH: ${ENABLE_RAG_WEB_SEARCH:-true}
      RAG_WEB_SEARCH_ENGINE: ${RAG_WEB_SEARCH_ENGINE:-duckduckgo}
      # Do NOT revalidate the embedding model against huggingface.co at boot.
      # Open WebUI loads SentenceTransformer inside the lifespan startup hook, so
      # the hub round-trip (snapshot_download) blocks the API socket: a slow or
      # flaky link turns every boot into a multi-minute hang where 127.0.0.1:3000
      # accepts and immediately resets, and nothing logs meanwhile. The model is
      # baked into the image / already in the volume, so skip the check; set
      # this to true (or delete the line) when deliberately changing models.
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: ${RAG_EMBEDDING_MODEL_AUTO_UPDATE:-false}
      # The hybrid-search reranker (Admin -> Documents -> Reranking) is loaded
      # inside that same lifespan hook, so it has the same boot-hang risk. It is
      # NOT baked into the image: the first boot after enabling hybrid search
      # needs network access to download the model into the open-webui volume.
      # After that, keep this false; set it to true (or delete the line) when
      # deliberately changing the reranking model. Env-only: no Admin-settings
      # toggle corresponds to it.
      RAG_RERANKING_MODEL_AUTO_UPDATE: ${RAG_RERANKING_MODEL_AUTO_UPDATE:-false}
      # BGE embedding models (Admin -> Documents -> Embedding Model) expect this
      # instruction on the QUERY side only; documents stay unprefixed. It is
      # env-only, so it cannot live in the Admin settings. Keep the trailing
      # space, and replace the value if the embedding model changes to one that
      # does not want an instruction. The `-` (not `:-`) matters: defining the
      # variable empty in .env must be able to clear the prefix.
      RAG_EMBEDDING_QUERY_PREFIX: "${RAG_EMBEDDING_QUERY_PREFIX-Represent this sentence for searching relevant passages: }"
      SEARXNG_QUERY_URL: ${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>}
      # CSP injected into sandboxed iframe documents (Artifacts previews etc.).
      # The OpenUI bundle is self-hosted same-origin, so no CDN origin is needed;
      # `connect-src 'none'` keeps rendered widgets/artifacts offline. The bundle
      # is served from the read-only ./openui mount below (intelligent-ui Phase 3; see docs/archive/plans/intelligent-ui/PLAN.md).
      # Keep Personal -> Interface -> "iframe Sandbox Allow Same Origin" OFF: the
      # widget shell relies on its own opaque-origin sandbox (see SECURITY.md).
      IFRAME_CSP: "${IFRAME_CSP:-default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'none'}"
    volumes:
      - open-webui:/app/backend/data
      # Pinned @openuidev/browser-bundle for inline widgets, served same-origin at
      # /static/openui/<version>/dist/... Installer-owned: learning-system's
      # scripts/setup_openwebui.py writes it here; OWUI only reads it (`:ro`).
      - ./openui:/app/backend/open_webui/static/openui:ro
    networks:
      - pi-net
    healthcheck:
      # The image is python-based; use python rather than assuming curl exists.
      test: ["CMD", "python3", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      # A cold boot imports torch/transformers before uvicorn binds 8080, which
      # is well past the old 60s window; a too-short start_period only makes
      # `compose ps` scream "unhealthy" at a container that is still loading.
      start_period: 120s

networks:
  pi-net:
    # Private user-defined bridge: gives searxng a resolvable name and keeps the
    # two containers off the default bridge. The host is still reached via
    # host-gateway (docker0, usually 172.17.0.1), where pi-bridge binds.
    driver: bridge

volumes:
  open-webui:
