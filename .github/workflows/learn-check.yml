name: learn-check

on:
  push:
    branches: [main]
  pull_request:

# Note: for pull_request events GitHub runs this workflow from the PR's merge
# ref, so a fork can show green checks for its own run. The push-to-main run is
# the authoritative gate; require branches to be up to date before merging.
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      # Full history so the floor guard and the guarded-file check can find a
      # merge base / base commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Offline checks only: behavior suites, resources, contract coverage,
      # sidecar compile. The load probe needs a pi binary and runs locally in
      # the update conductor.
      - name: learn-check (offline)
        run: scripts/learn-check --no-load

      - name: check-docs
        run: python3 scripts/check-docs

      # New gate: warns until 2026-11-24, then promote to blocking if it stayed
      # clean for the whole window (see CONSTRAINTS.md).
      - name: check-skills
        continue-on-error: true
        run: scripts/check-skills

      # The floor blocks: a diff that adds suppressions, weakens a test, or
      # loosens a CONSTRAINTS.md threshold fails the change.
      - name: floor-guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "no base commit; floor guard skipped for a new branch"
          else
            node scripts/floor-guard.mjs --base "$BASE_SHA"
          fi

      # External constraint: gitleaks carries its own secrets rule database, so
      # at least one gate is not judged by this project's own tests. CI-only to
      # keep laptops clean. .gitleaks.toml extends the default ruleset and
      # allowlists one frozen-source false positive.
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner

      # CONTRACT.md, contracts/, and test/ are the revise door. Every commit
      # that touches them needs a revise(contract): subject, so a legitimate
      # revise commit cannot whitelist a drive-by edit from another commit.
      - name: guarded files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "no base commit; guarded-file check skipped for a new branch"
            exit 0
          fi
          failed=0
          while read -r commit; do
            guarded="$(git diff-tree --no-commit-id --name-only -r "$commit" | grep -E '^(CONTRACT\.md|contracts/|test/)' || true)"
            [[ -z "$guarded" ]] && continue
            subject="$(git log -1 --format=%s "$commit")"
            if [[ "$subject" != revise\(contract\):* ]]; then
              echo "commit $commit touches guarded files without a revise(contract): subject:" >&2
              echo "  $subject" >&2
              echo "$guarded" >&2
              failed=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

      - name: state unit tests
        working-directory: state
        run: |
          python3 -m pip install pydantic
          python3 -m unittest discover -s scripts -p '*_test.py'
