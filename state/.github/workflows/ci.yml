name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python
        run: python -m py_compile scripts/*.py

      - name: Unit tests (ops sidecar)
        run: python -m unittest scripts.ops_test -v

      - name: Unit tests (OpenUI assets + gate carve-out; needs pydantic)
        run: |
          pip install pydantic
          python -m unittest scripts.openui_test -v

      - name: Learner history regenerates cleanly
        run: python scripts/learner_history.py

      - name: Compose file parses with example env
        run: |
          pip install pyyaml
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/docker-compose.yml config --quiet

      - name: No plaintext secrets in tracked files
        run: |
          ! grep -rn "sk-[A-Za-z0-9]\{20,\}" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.md" --include="*.sh" . \
            || { echo "::error::potential API key committed"; exit 1; }
