title: "[Show and tell]: "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        Built something with the system, or ran an experiment worth sharing? Show it off here.

  - type: textarea
    id: what
    attributes:
      label: What you built
      description: A short description of what it is and what it does.
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link
      description: A repo, gist, screenshot, or write-up.
      placeholder: https://
    validations:
      required: false

  - type: textarea
    id: learned
    attributes:
      label: What you learned
      description: Anything surprising, useful, or worth passing on to the community.
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related discussions
      description: Links to related discussions, issues, or docs.
    validations:
      required: false
