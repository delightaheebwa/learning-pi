<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">learning-pi logo</title>
  <desc id="desc">A geometric three-part mark in coral, blue and amber, paired with the learning-pi wordmark.</desc>
  <rect width="1200" height="420" fill="#FFFFFF"/>
  <g transform="translate(52 42)">
    <!-- Three interlocking learning blocks; the open centre suggests a path through the system. -->
    <path d="M34 0H272Q286 0 286 14V190H210V76H34Z" fill="#F27F72"/>
    <path d="M34 76H110V152H172V228H110V304H34Z" fill="#4599B8"/>
    <path d="M210 190H286V304H210Z" fill="#F2BD55"/>
    <!-- Small, deliberate corner softening keeps the geometry friendly at app-icon scale. -->
    <path d="M34 0H272Q286 0 286 14V190H210V76H34Z" fill="none" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="3"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="650" letter-spacing="-3">
    <text x="405" y="238" font-size="112" fill="#182B3A">learning</text>
    <text x="890" y="238" font-size="112" fill="#F27F72">-pi</text>
  </g>
  <text x="412" y="294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" letter-spacing="4" fill="#647887">PROBE. VERIFY. REMEMBER.</text>
</svg>